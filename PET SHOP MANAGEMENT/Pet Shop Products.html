<!DOCTYPE html>
<!-- saved from url=(0039)file:///D:/web%20designing/product.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Shop Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e75c34;
            margin: 0;
            color: white;
        }

        .products {
            padding: 40px 20px;
            text-align: center;
        }

        .product-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 250px;
            text-align: center;
            color: #333;
        }

        .product img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .add-to-cart, .buy-now {
            background-color: #ff7043;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }

        .add-to-cart:hover, .buy-now:hover {
            background-color: #e64a19;
        }

        .cart-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff7043;
            color: white;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
        }

        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .cart-modal-content {
            background: linear-gradient(135deg, #ff7043, #e75c34);
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            color: white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s ease-in-out;
        }

        .cart-modal-content.show {
            transform: scale(1);
        }

        .cart-modal input, .cart-modal select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            transition: background 0.3s;
        }

        .cart-modal input:focus, .cart-modal select:focus {
            background: #fff;
        }

        .cart-modal-content button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .cart-modal-content button:hover {
            background-color: #d84315;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Cart Info Button -->
    <div class="cart-info" onclick="showCart()">Cart</div>

    <!-- Products Section -->
    <section id="products" class="products">
        <div class="container">
            <h1>Featured Products</h1>
            <div class="product-list">
                <div class="product">
                    <img src="./Pet Shop Products_files/dog food.jpeg" alt="Dog Food">
                    <h3>Dog Food</h3>
                    <p>₹750.00</p>
                    <button class="add-to-cart" onclick="addToCart(&#39;Dog Food&#39;, 750)">Add to Cart</button>
                </div>
                <div class="product">
                    <img src="./Pet Shop Products_files/dog bone.jpeg" alt="Dog Bone">
                    <h3>Dog Bone</h3>
                    <p>₹400.00</p>
                    <button class="add-to-cart" onclick="addToCart(&#39;Dog Bone&#39;, 400)">Add to Cart</button>
                </div>
                    <div class="product">
                        <img src="./Pet Shop Products_files/dog medicine.jpg" alt="Dog Medicine">
                        <h3>Dog Medicine</h3>
                        <p>₹500.00</p>
                        <button class="add-to-cart" onclick="addToCart(&#39;Dog Medicine&#39;, 500)">Add to Cart</button>
                    </div>
                        <div class="product">
                            <img src="./Pet Shop Products_files/cat food.webp" alt="Cat Food">
                            <h3>Cat Food</h3>
                            <p>₹1500.00</p>
                            <button class="add-to-cart" onclick="addToCart(&#39;Cat Food&#39;, 1500)">Add to Cart</button>
                        </div><br>
                       
                            <div class="product">
                                <img src="./Pet Shop Products_files/cat medicine.webp" alt="Cat Medicine">
                                <h3>Cat Medicine</h3>
                                <p>₹560.00</p>
                                <button class="add-to-cart" onclick="addToCart(&#39;Cat Medicine&#39;, 560)">Add to Cart</button>
                            </div><br>
                                <div class="product">
                                    <img src="./Pet Shop Products_files/cat toy.webp" alt="Cat Toy">
                                    <h3>Cat Toy</h3>
                                    <p>₹2500.00</p>
                                    <button class="add-to-cart" onclick="addToCart(&#39;Cat Toy&#39;, 2500)">Add to Cart</button>
                                </div><br>
                                    <div class="product">
                                        <img src="./Pet Shop Products_files/birdfood.jpg" alt="Bird Food">
                                        <h3>Bird Food</h3>
                                        <p>₹250.00</p>
                                        <button class="add-to-cart" onclick="addToCart(&#39;Bird Food&#39;, 250)">Add to Cart</button>
                                    </div><br>
                                        <div class="product">
                                            <img src="./Pet Shop Products_files/bird cage.jpeg" alt="Bird Cage">
                                            <h3>Bird Cage</h3>
                                            <p>₹2700.00</p>
                                            <button class="add-to-cart" onclick="addToCart(&#39;Bird Cage&#39;, 2700)">Add to Cart</button>
                                        </div><br>
                                            <div class="product">
                                                <img src="./Pet Shop Products_files/fish food.jpg" alt="Fish Food">
                                                <h3>Fish Food</h3>
                                                <p>₹350.00</p>
                                                <button class="add-to-cart" onclick="addToCart(&#39;Fish Food&#39;, 350)">Add to Cart</button>
                                            </div><br>
            </div>
        </div>
    </section>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <h2>Your Cart</h2>
            <div id="cartItems"></div>
            <div class="total-price" id="totalPrice">Total: ₹0.00</div>
            <button onclick="buyNowFromCart()">Buy Now</button>
            <button onclick="closeCartModal()">Close</button>
        </div>
    </div>

    <!-- Buy Now Modal -->
    <div class="cart-modal" id="buyNowModal">
        <div class="cart-modal-content">
            <h1>Purchase Details</h1>
            <input type="text" id="userName" placeholder="Your Name" required="">
            <input type="text" id="userAddress" placeholder="Your Address" required="">
            <input type="tel" id="userPhone" placeholder="Phone Number" required="">
            <select id="paymentMode" required="">
                <option value="" disabled="" selected="">Select Payment Mode</option>
                <option value="creditCard">Credit Card</option>
                <option value="debitCard">Debit Card</option>
                <option value="netBanking">Net Banking</option>
                <option value="upi">UPI</option>
                <option value="cashOnDelivery">Cash on Delivery</option>
            </select>
            <button onclick="confirmPurchase()">Confirm Purchase</button>
            <button onclick="closeBuyNowModal()">Cancel</button>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(product, price) {
            const itemIndex = cart.findIndex(item => item.product === product);
            if (itemIndex > -1) {
                cart[itemIndex].quantity += 1;
            } else {
                cart.push({ product, price, quantity: 1 });
            }
            alert(`${product} has been added to your cart.`);
        }

        function showCart() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
            } else {
                const cartItemsContainer = document.getElementById("cartItems");
                cartItemsContainer.innerHTML = "";
                let total = 0;

                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    cartItemsContainer.innerHTML += `
                        <div class="cart-item">
                            <span>${item.product} - ₹${item.price} x ${item.quantity} = ₹${itemTotal}</span>
                            <button onclick="changeQuantity('${item.product}', -1)">-</button>
                            <button onclick="changeQuantity('${item.product}', 1)">+</button>
                        </div>
                    `;
                });

                document.getElementById("totalPrice").innerText = `Total: ₹${total}`;
                document.getElementById("cartModal").style.display = "flex";
            }
        }

        function changeQuantity(product, change) {
            const itemIndex = cart.findIndex(item => item.product === product);
            if (itemIndex > -1) {
                cart[itemIndex].quantity += change;
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
                showCart();
            }
        }

        function closeCartModal() {
            document.getElementById("cartModal").style.display = "none";
        }

        function buyNowFromCart() {
            const modal = document.getElementById("buyNowModal");
            document.getElementById("cartModal").style.display = "none";
            modal.style.display = "flex";
        }

        function confirmPurchase() {
            const name = document.getElementById("userName").value.trim();
            const address = document.getElementById("userAddress").value.trim();
            const phone = document.getElementById("userPhone").value.trim();
            const paymentMode = document.getElementById("paymentMode").value;

            if (name && address && phone && paymentMode) {
                alert(`Purchase Confirmed!\n\nDetails:\nName: ${name}\nAddress: ${address}\nPhone: ${phone}\nPayment Mode: ${paymentMode}`);
                cart = []; // Clear the cart after purchase
                closeBuyNowModal(); // Close the modal
            } else {
                alert("Please fill in all fields, including the payment mode, to complete the purchase.");
            }
        }

        function closeBuyNowModal() {
            document.getElementById("buyNowModal").style.display = "none";
        }
    </script>

</body></html>
